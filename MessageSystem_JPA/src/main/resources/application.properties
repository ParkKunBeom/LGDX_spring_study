spring.application.name=MessageSystem_JPA

# contextPath(contextRoot) 설정
# 만약에 설정하지 않으면 "/" 가 기본값으로 contextPath
server.servlet.context-path=/msg

# port 번호 설정
server.port=8083

# post 방식 인코딩 설정
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
spring.servlet.encoding.enabled=true

# DB 설정(Oracle)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
# spring.datasource.url=jdbc:mysql://localhost:3306/스키마
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=hr
spring.datasource.password=hr

# JPA 설정
# 컬럼을 추가를 한다던가, 컬럼의 길이가 바뀐다던가, 제약조건을 걸어준다던가
# 계속 수정이 일어날 수 있기 때문에 create가 아닌 update로 설정
spring.jpa.hibernate.ddl-auto=update

# 꼭 안써도 되지만 내가 쓰는 DBMS에 맞는 쿼리로 짜주세요! 라고 명시
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# SQL 쿼리문을 콘솔창에 보이게 하기(필수 아님) -> 일렬로 출력
spring.jpa.show-sql=true

# 쿼리가 일렬로 출력되는게 아닌 가독성있게 출력
spring.jpa.properties.hibernate.format_sql=true

# 파일 업로드 기능 활성화
spring.servlet.multipart.enabled=true

# 파일 업로드 시 1개의 최대 용량 크기
spring.servlet.multipart.max-file-size=10MB

# 요청 전체의 최대 크기
spring.servlet.multipart.max-request-size=20MB
