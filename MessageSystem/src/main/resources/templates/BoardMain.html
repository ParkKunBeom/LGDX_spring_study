<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html xmlns:th="http://www.thymeleaf.org">
<head>
		<title>Forty by HTML5 UP</title>
		<meta charset="utf-8" />
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<link rel="stylesheet" th:href="@{/assetsBoard/css/main.css}" />
		<link rel="stylesheet" th:href="@{/assetsBoard/css/board.css}" />
		
</head>
<body>		
			<!-- Q17. 게시글 목록 조회 기능 -->
			<!-- Q18. 게시글 목록 세부페이지 기능(제목을 클릭하면 세부페이지 BoardDetail.jsp로 이동)-->
			<div id="board">
				<table id = "list">
					<tr>
						<td>번호</td>
						<td>제목</td>
						<td>작성자</td>
						<td>시간</td>
					</tr>
					
					<!-- 쿼리스트링 방식 -->
					<!--  url?keyu1=val1&key2=val2 -->
					<!--  실제 요청 URL : /boardDetail?idx=3 -->
					<!-- 장점 : 데이터를 여러개 보낼수 있음 -->
					
					<!--  PathVariable방식 -->
					<!-- url/3 -->
					<tr th:each="board, stat : ${boardList}">
						<td th:text="${stat.count}"></td>
						<td><a th:href="@{/boardDetail/{num}(num=${board.idx})}" th:text="${board.title}"></a></td>
						<td th:text="${board.writer}"></td>
						<td th:text="${board.b_date}"></td>
						<td><a th:if="${session.mem != null and session.mem.email == 'admin'}"  th:href="@{/boardDelete/{idx}(idx=${board.idx})}">삭제</a></td>
					</tr>
				</table>
				
				<a th:href="@{/}"><button id="writer">홈으로가기</button></a>
				<a th:href="@{/boardWrite}"><button id="writer">작성하러가기</button></a>
			</div>

			<!-- Scripts -->
			<script th:src="@{/assets/js/jquery.min.js}"></script>
			<script th:src="@{/assets/js/jquery.scrolly.min.js}"></script>
			<script th:src="@{/assets/js/jquery.scrollex.min.js}"></script>
			<script th:src="@{/assets/js/skel.min.js}"></script>
			<script th:src="@{/assets/js/util.js}"></script>
			<script th:src="@{/assets/js/main.js}"></script>
</body>
</html>
