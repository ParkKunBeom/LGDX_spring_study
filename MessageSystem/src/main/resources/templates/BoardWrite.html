<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html xmlns:th="http://www.thymeleaf.org">
<head>
		<title>Forty by HTML5 UP</title>
		<meta charset="utf-8" />
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<link rel="stylesheet" th:href="@{/assetsBoard/css/main.css}" />
		<link rel="stylesheet" th:href="@{/assetsBoard/css/board.css}" />
</head>
<body>


			<!-- Q16. 게시글 작성 기능(작성된 게시글은 DB에 저장) - 파일업로드 cos.jar 사용 -> JSP용 -->
			<!-- Spring Boot에서는 파일업로드 기능이 내장되어 있음, Multipart객체 바로 사용 가능 -->
			<div id = "board">
			
			<!-- 
				enctype
				1. application/x-www-form-urlencoded
				 -> form태그 안에서 보내는 요청데이터를 name(key)값과 value방식으로 보내는 형태
				2. multipart/form-data
				 -> 사진파일과 같이 용량이 큰 데이터를 보낼 때 사용(무조건 post방식으로 요청)
			 -->
				<form th:action="@{/boardUpload}" method="post" enctype="multipart/form-data">
				<table id="list">
					<tr>
						<td>제목</td>
						<td><input type="text" name="title"> </td>
					</tr>
					<tr>
						<td>작성자</td>
						<td><input type="text" name="writer"> </td>
					</tr>
					<tr>
						<td colspan="2">내용</td>
					</tr>
					<tr>
						<td colspan="2">
							<input type="file" style="float: right;" name="uploadFile">
							<textarea rows="10" style="resize: none;" name="content"></textarea>			
						</td>
					</tr>
					<tr>
						<td colspan="2">
							<input type="reset" value="초기화">
							<input type="submit" value="작성하기">
						</td>
					</tr>
				</table>
				</form>
			</div>
			<!-- Scripts -->
			<script th:src="@{/assets/js/jquery.min.js}"></script>
			<script th:src="@{/assets/js/jquery.scrolly.min.js}"></script>
			<script th:src="@{/assets/js/jquery.scrollex.min.js}"></script>
			<script th:src="@{/assets/js/skel.min.js}"></script>
			<script th:src="@{/assets/js/util.js}"></script>
			<script th:src="@{/assets/js/main.js}"></script>
</body>
</html>
