# 프로젝트 이름
spring.application.name=MessageSystem 

# contextPath(contextRoot) 설정
# 만약에 설정하지 않으면 "/" 가 기본값으로 contextPath
server.servlet.context-path=/msg

# port 번호 설정
server.port=8082

# post 방식 인코딩 설정
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
spring.servlet.encoding.enabled=true

# DB 설정(Oracle)
spring.datasource.url=kdbc:oracle:thin:localhost:1521:xe
# spring.datasource.url=jdbc:mysql://localhost:3306/스키마
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=hr
spring.datasource.password=hr

# MyBatis 설정
mybatis.mapper-default-scope= classpath:/mapper/*.xml

	
